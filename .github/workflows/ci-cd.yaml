name: CI Local Pipeline (Java + Docker + K8s)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. Dá permissão de execução e compila
      - name: Build Java Application
        run: |
          chmod +x ./docker-java-api/mvnw
          ./docker-java-api/mvnw clean package -DskipTests --file ./docker-java-api/pom.xml

      # 2. Constrói a imagem Docker para validar se o Dockerfile
      - name: Build Docker Image
        run: |
          docker build -t docker-java-api:1.0.0 ./docker-java-api

      # 3. Valida a sintaxe de todos os manifestos Kubernetes.
      - name: Validate K8s Manifests (Dry-Run)
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          ./kubectl apply --dry-run=client -f k8s/
