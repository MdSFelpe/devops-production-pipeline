name: CI/CD Pipeline (Java + Docker + K8s + Terraform)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/docker-java-api

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: docker-java-api/pom.xml

      - name: Build Java Application
        run: |
          chmod +x ./docker-java-api/mvnw
          ./docker-java-api/mvnw clean package -DskipTests --file ./docker-java-api/pom.xml

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_LOWER:latest -t $IMAGE_LOWER:${{ github.sha }} ./docker-java-api
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push $IMAGE_LOWER:latest
            docker push $IMAGE_LOWER:${{ github.sha }}
          fi

      - name: Validate K8s Manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate

  deploy-aws-ssm:
    name: Deploy to AWS EC2 via SSM
    runs-on: ubuntu-latest
    needs: [ build-and-validate, validate-terraform ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Container via AWS SSM
        env:
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" | tr '[:upper:]' '[:lower:]')

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=java-springboot-api-dev-app-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Nenhuma instância EC2 em execução no momento. Deploy ignorado."
            exit 0
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[
              \"sudo docker pull $IMAGE_LOWER\",
              \"sudo docker stop java-springboot-api || true\",
              \"sudo docker rm java-springboot-api || true\",
              \"sudo docker run -d --name java-springboot-api --restart unless-stopped -p 8080:8080 -e SPRING_DATASOURCE_URL=jdbc:postgresql://$RDS_ENDPOINT:5432/springbootdb -e SPRING_DATASOURCE_USERNAME=postgres -e SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD $IMAGE_LOWER\"
            ]}" \
            --query "Command.CommandId" \
            --output text)

          echo "Aguardando execução do comando SSM ($COMMAND_ID) na instância $INSTANCE_ID..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Deploy concluído com sucesso na EC2!"