#
#DEPLOYMENT FOR API-JAVA
#
#
# DEPLOYMENT FOR API-JAVA
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-java-deployment
  labels:
    app: api-java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-java
  template:
    metadata:
      labels:
        app: api-java
    spec:
      automountServiceAccountToken: false
      containers:
        - name: conteiner-api-java
          image: docker-java-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "500Mi" # Resolve a regra S6897 no requests
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
---

#SERVICE FOR API-JAVA
#

apiVersion: v1
kind: Service
metadata:
  name: api-java-service
spec:
  type: NodePort
  selector:
    app: api-java
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080